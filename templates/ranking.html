{% extends "layout.html" %}
{% block content %}
<div class="ranking-container">
    <h1 class="page-title">Ranking de Técnicos</h1>

    <div class="ranking-list">
        {% for tecnico in ranking %}
        <div class="card ranking-card">

            <div class="ranking-card-left">
                <span class="ranking-position">
                    #{{ loop.index }}
                </span>

                <div class="ranking-info">
                    <span class="ranking-name">
                        {{ tecnico.name }}
                    </span>
                    {% if tecnico.workspace_names %}
                    <span class="ranking-workspace">
                        {{ tecnico.workspace_names }}
                    </span>
                    {% endif %}
                </div>
            </div>

            <div class="ranking-card-right">
                <span class="ranking-label">
                    Finalizados
                </span>
                <span class="ranking-score">
                    {{ tecnico.worklogs_count }}
                </span>
            </div>

        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
