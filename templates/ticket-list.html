{% extends "layout.html" %}
{% block content %}
<div class="ticket-list-container">
    <h1 class="page-title">Lista de Serviços</h1>

    <div class="ticket-list">
        {% for ticket in tickets %}
        <a href="{{ url_for('tickets.perfil_servico', ticket_id=ticket.id) }}" class="ticket-link">
            <div class="card ticket-item">
                <div class="ticket-item-left">
                    <span class="ticket-id">#{{ ticket.id }}</span>
                    <span class="ranking-name">{{ ticket.title }}</span>
                </div>
                <div class="ticket-item-right">
                    <span class="badge badge-secondary">{{ ticket.workspace_name }}</span>
                    <span class="badge-outline badge">{{ ticket.status }}</span>
                </div>
            </div>
        </a>
        {% else %}
        <p class="text-empty">Nenhum serviço encontrado.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
