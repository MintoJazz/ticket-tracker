{% extends "layout.html" %}
{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 2rem;">
        <a href="{{ url_for('tickets.perfil_servico', id=ticket_id) }}" class="btn" style="background-color: var(--muted); border: 1px solid var(--border);">
            ← Cancelar
        </a>
        <h1 style="margin: 0;">Registrar Worklog</h1>
    </div>

    <p style="color: var(--muted-foreground); font-size: 0.875rem; margin-bottom: 2rem;">
        Adicionando um novo registro ao chamado <strong>#{{ ticket_id }}</strong>.<br>
        Dica: Digite 'resolvido' na mensagem para finalizar o chamado automaticamente.
    </p>

    <form method="POST">
        <div class="form-group">
            <label>Técnico Responsável</label>
            <select name="user_id" required autofocus>
                <option value="" disabled selected>Selecione seu usuário...</option>
                {% for tecnico in tecnicos %}
                <option value="{{ tecnico.id }}">{{ tecnico.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label>Mensagem / Descrição do Serviço</label>
            <textarea name="mensagem" rows="5" placeholder="Descreva os procedimentos realizados..." required></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">
            Salvar Worklog
        </button>
    </form>
</div>
{% endblock %}
